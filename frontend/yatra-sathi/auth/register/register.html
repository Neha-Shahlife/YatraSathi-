<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Account · Yatra Sathi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="auth-shell">
      <aside class="auth-visual">
        <div class="eyebrow" style="color: #d8c49a">YATRA SATHI</div>
        <h1 style="margin-top: 18px">Good journeys are better together.</h1>
        <p>
          Create your profile and let compatible travellers know who they could
          be travelling with.
        </p>
      </aside>
      <main class="auth-form-wrap">
        <div class="auth-form">
          <a class="back" href="../../landing/landing.html"
            >← Back to Yatra Sathi</a
          >
          <div class="brand">YATRA SATHI</div>
          <h1 class="auth-title">Create your account.</h1>
          <p class="auth-sub">It only takes a minute to get started.</p>
          <form id="register-form" class="stack">
            <div class="field">
              <label>Full name</label
              ><input
                id="name"
                class="input"
                required
                placeholder="Your name"
              />
            </div>
            <div class="field">
              <label>Email</label
              ><input
                id="email"
                class="input"
                type="email"
                required
                placeholder="you@example.com"
              />
            </div>
            <div class="grid grid-2">
              <div class="field">
                <label>Age</label
                ><input
                  id="age"
                  class="input"
                  type="number"
                  min="16"
                  required
                />
              </div>
              <div class="field">
                <label>Travel style</label
                ><select id="type" class="select">
                  <option>Slow travel</option>
                  <option>Adventure</option>
                  <option>Road trip</option>
                  <option>Trekking</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label>Password</label
              ><input
                id="password"
                class="input"
                type="password"
                minlength="8"
                required
              />
            </div>
            <button class="btn btn-primary btn-block auth-submit">
              Create account
            </button>
          </form>
          <div class="auth-divider">or</div>
          <button class="google" id="google-register" type="button">
            <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
              <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
              <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z"/>
              <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
          <p class="small" style="text-align: center; margin-top: 22px">
            Already have an account?
            <a
              style="color: var(--forest); font-weight: 700"
              href="../login/login.html"
              >Log in</a
            >
          </p>
        </div>
      </main>
    </div>

    <script src="../../assets/js/config.js"></script>
    <script src="../../assets/js/store.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
