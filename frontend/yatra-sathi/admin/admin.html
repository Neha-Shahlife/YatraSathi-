<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard · Yatra Sathi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/common.css" />
  </head>
  <body>
    <main class="page">
      <div class="container">
        <div class="between section-head">
          <div>
            <div class="eyebrow">Administration</div>
            <h1 style="font-size: 46px; margin-top: 8px">System Admin Panel</h1>
            <p style="margin-top: 8px">
              Superuser overview. Manage registered users and every travel
              plan created on the site.
            </p>
          </div>
          <div class="row">
            <span class="badge gold" id="admin-name"></span>
            <button class="btn btn-outline" id="admin-logout">Log out</button>
          </div>
        </div>

        <div class="grid grid-4" id="admin-stats"></div>

        <!-- Manage users -->
        <section style="margin-top: 30px" class="card card-pad">
          <div class="between">
            <div>
              <div class="eyebrow">User management</div>
              <h3 style="margin-top: 6px">Registered users</h3>
            </div>
            <span class="small muted" id="users-count"></span>
          </div>
          <div style="overflow: auto; margin-top: 15px">
            <table class="table" id="users-table"></table>
          </div>
        </section>

        <!-- Manage travel plans -->
        <section style="margin-top: 30px" class="card card-pad">
          <div class="between">
            <div>
              <div class="eyebrow">Plan management</div>
              <h3 style="margin-top: 6px">Travel plans</h3>
            </div>
            <span class="small muted" id="trips-count"></span>
          </div>
          <div style="overflow: auto; margin-top: 15px">
            <table class="table" id="trips-table"></table>
          </div>
        </section>
      </div>
    </main>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="script.js"></script>
  </body>
</html>
